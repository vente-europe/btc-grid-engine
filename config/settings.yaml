# BTC Grid Decision Engine - konfiguracja V1
# Zrodlo prawdy dla wszystkich skryptow. Nie hardkodowac tych wartosci w kodzie.

symbol: BTCUSDT
venue: bybit            # venue egzekucji; binance tylko jako zrodlo historii / fallback CORS

data:
  history_months: 24    # ile historii do walidacji i backtestu
  canonical_interval: 1m
  parquet_dir: data/parquet
  raw_dir: data/raw

horizons_hours: [1, 4, 24]   # horyzonty ekskursji; domyslny na dashboardzie: 4h
default_horizon: 4

trailing_windows_days: [1, 3, 7]   # okna oscylacji/trendu na dashboardzie
regime_baseline_days: 90           # baza percentyla zmiennosci (60-90)

variants:                # percentyle spreadu (touch prob = 1 - percentyl)
  aggressive: 0.50
  balanced: 0.60         # rekomendowany
  conservative: 0.70

fees:
  maker: 0.001           # Bybit spot non-VIP; TODO: odczyt realnej stawki z API konta
  taker: 0.001
  spread_est: 0.0001
  slippage_buffer: 0.0002
  min_net_profit: 0.0005
  # MPD = suma powyzszych (~0.0028); regula: spread >= 1.5 x MPD

ladder_multipliers: [1.0, 1.75, 2.75, 4.0]

no_trade:
  vol_percentile_max: 90        # powyzej: NO TRADE
  shock_ratio_wait: 2.0         # 1h vol vs 24h vol: powyzej WAIT
  oscillation_min: 30           # ponizej: NO TRADE (rynek kierunkowy)
  breakout_lookback_hours: 24   # wybicie poza high/low -> WAIT
  breakout_cooldown_hours: 3
  mpd_multiple_min: 1.5

events:
  file: config/events.json      # FOMC + CPI, okno WAIT +/- godziny ponizej
  window_before_hours: 2
  window_after_hours: 2

recalc:
  max_age_hours: 12             # rekomendacja wygasa po tym czasie
